name: test
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', 'test/**', '.github/workflows/**']
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/namu_ranking_snapshot.mjs
      - run: node --test --test-timeout=30000 "test/*.test.mjs"
